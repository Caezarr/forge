name: Bug report
description: Report a bug in Forge
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or screenshot notes
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - quests
        - auth
        - db
        - focus
        - ui
        - other
    validations:
      required: true
